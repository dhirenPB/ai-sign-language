[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-cleaner"
version = "0.1.0"
description = "Phase 1 of the English -> ISL gloss project: conservative, auditable transcript cleaning and segmentation."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Layer 2 only. The spaCy model is a separate download: python -m spacy download en_core_web_sm
layer2 = ["spacy>=3.5", "nltk"]
# YouTube ingestion only. FFmpeg is a separate program; the Whisper model downloads on first use.
youtube = ["yt-dlp", "faster-whisper"]

[project.scripts]
transcript-cleaner = "transcript_cleaner.cli:main"
isl-gloss = "isl_gloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcript_cleaner = ["schemas/*.json"]
isl_gloss = ["webui/static/*.html"]
